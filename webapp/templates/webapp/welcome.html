{% extends "webapp/base.html" %}

{% block title %}Gestão de Salas{% endblock %}

{% block content %}
<main class="container min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-sm border-0" style="max-width: 36rem;">
    <div class="card-body p-5 text-center">
      <p class="text-primary fw-semibold mb-2">Gestão de Salas</p>
      <h1 class="h2 mb-3">Bem-vindo, {{ user.username }}</h1>
      <p class="text-secondary mb-4">
        Você está autenticado. Esta é a rota inicial da aplicação.
      </p>
      <div class="d-flex justify-content-center gap-2 mb-4">
        <a href="{% url 'agendar_sala' %}" class="btn btn-primary">Agendar Sala</a>
        <a href="{% url 'sala_list' %}" class="btn btn-outline-primary">Gerenciar Salas</a>
      </div>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary">Sair</button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
